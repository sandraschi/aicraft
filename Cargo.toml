[workspace]
members = [
    "crates/aicraft-core",
    "crates/aicraft-mcp",
    "crates/aicraft-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["sandraschi fleet <sandraschi@example.com>"]
license = "MIT"
repository = "https://github.com/sandraschi/aicraft"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "process"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
chrono = { version = "0.4", features = ["serde"] }
databasecraft-store = { path = "../databasecraft/crates/databasecraft-store" }
craft-ai-core = { path = "../craft-ai/crates/craft-ai-core" }
walkdir = "2.5"
